name: roslyn-current-main-regression-lab

on:
  push:
    branches:
      - dotnet-bounty-lab-20260921
    paths:
      - .github/workflows/roslyn-current-main-regression-lab.yml
      - labs/patch_roslyn_current_main_regression.py

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-rc.1.26425.128'

      - name: Clone current Roslyn main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/roslyn-current-main
          git clone --depth 1 https://github.com/dotnet/roslyn.git /tmp/roslyn-current-main
          cd /tmp/roslyn-current-main
          echo "ROSLYN_CURRENT_MAIN_SHA=$(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Inject same-MVID different-content regression
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/labs/patch_roslyn_current_main_regression.py" /tmp/roslyn-current-main
          grep -n "SameMvidDifferentContentSameDirectory_CurrentMainAcceptsCollision" /tmp/roslyn-current-main/src/Compilers/Server/VBCSCompilerTests/AnalyzerConsistencyCheckerTests.cs

      - name: Run current-main regression
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/roslyn-current-main
          dotnet test src/Compilers/Server/VBCSCompilerTests/VBCSCompiler.UnitTests.csproj -f net10.0 --filter "FullyQualifiedName~AnalyzerConsistencyCheckerTests.SameMvidDifferentContentSameDirectory_CurrentMainAcceptsCollision" --logger "console;verbosity=normal"
