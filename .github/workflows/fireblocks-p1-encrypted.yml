name: Fireblocks P1 Encrypted Validation

on:
  push:
    branches:
      - fireblocks-p1-encrypted-20260924
    paths:
      - .github/workflows/fireblocks-p1-encrypted.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fireblocks-p1-encrypted-20260924
          fetch-depth: 0

      - name: Publish ephemeral payload key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner_exchange/fireblocks_p1
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/source_private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/source_private.pem -pubout -out runner_exchange/fireblocks_p1/source_public.pem >/dev/null 2>&1
          git config user.name "encrypted-fireblocks-validator"
          git config user.email "encrypted-fireblocks-validator@users.noreply.github.com"
          git add runner_exchange/fireblocks_p1/source_public.pem
          git commit -m "Publish Fireblocks ephemeral payload key [skip ci]" >/dev/null
          git push origin HEAD:fireblocks-p1-encrypted-20260924 >/dev/null

      - name: Wait for encrypted PoC payload
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for i in $(seq 1 300); do
            git fetch origin fireblocks-p1-encrypted-20260924 --quiet
            ok=1
            for f in payload.b64 payload_key.b64 result_public.pem; do
              git show "origin/fireblocks-p1-encrypted-20260924:runner_exchange/fireblocks_p1/$f" > "/tmp/$f" 2>/dev/null || ok=0
            done
            if [ "$ok" = "1" ]; then found=1; break; fi
            sleep 2
          done
          test "$found" = "1"

      - name: Decrypt PoC payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/payload_key.b64 > /tmp/payload_key.enc
          base64 -d /tmp/payload.b64 > /tmp/payload.enc
          openssl pkeyutl -decrypt -inkey /tmp/source_private.pem             -in /tmp/payload_key.enc -out /tmp/payload_keyiv.bin             -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          test "$(stat -c%s /tmp/payload_keyiv.bin)" = "48"
          KEY=$(dd if=/tmp/payload_keyiv.bin bs=1 count=32 2>/dev/null | od -An -tx1 | tr -d ' \n')
          IV=$(dd if=/tmp/payload_keyiv.bin bs=1 skip=32 count=16 2>/dev/null | od -An -tx1 | tr -d ' \n')
          openssl enc -d -aes-256-cbc -K "$KEY" -iv "$IV"             -in /tmp/payload.enc -out /tmp/payload.zip
          unzip -t /tmp/payload.zip >/dev/null
          rm -rf /tmp/poc && mkdir /tmp/poc
          unzip -q /tmp/payload.zip -d /tmp/poc
          test -f /tmp/poc/fireblocks_p1_payload/test_fragment.cpp

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev uuid-dev libsecp256k1-dev

      - name: Fetch exact Fireblocks source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mpc-lib
          git init -q /tmp/mpc-lib
          git -C /tmp/mpc-lib remote add origin https://github.com/fireblocks/mpc-lib.git
          git -C /tmp/mpc-lib fetch -q --depth 1 origin 00ae08b7f1bdbb887aedece384aca2f942aae432
          git -C /tmp/mpc-lib checkout -q FETCH_HEAD
          git -C /tmp/mpc-lib rev-parse HEAD | tee /tmp/source_sha.txt
          cat /tmp/poc/fireblocks_p1_payload/test_fragment.cpp >> /tmp/mpc-lib/test/cosigner/setup_test.cpp
          git -C /tmp/mpc-lib diff -- test/cosigner/setup_test.cpp > /tmp/poc.diff

      - name: Build real mpc-lib test target
        shell: bash
        run: |
          set -euo pipefail
          cmake -S /tmp/mpc-lib -B /tmp/mpc-build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build /tmp/mpc-build --target cosigner_test -j2

      - name: Execute focused PoC
        id: poc
        shell: bash
        run: |
          set -o pipefail
          /tmp/mpc-build/test/cosigner/cosigner_test "cmp incomplete source add_user threshold collapse" --success 2>&1 | tee /tmp/run.log
          RC=${PIPESTATUS[0]}
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          STATUS=FAIL
          if [ "$RC" -eq 0 ] &&
             grep -q '^P1_CHAIN_CONFIRMED=1$' /tmp/run.log &&
             grep -q '^SOURCE_SETUP_STOPPED_AFTER_ROUND1=1$' /tmp/run.log &&
             grep -q '^SOURCE_PUBLIC_KEY_INFINITY_EXPORTED=1$' /tmp/run.log &&
             grep -q '^ONLY_ONE_SOURCE_PARTICIPANT_SUPPLIED=1$' /tmp/run.log &&
             grep -q '^HONEST_DESTINATION_SETUP_FINALIZED=1$' /tmp/run.log &&
             grep -q '^DEST_SECRET_EQUALS_ATTACKER_SOURCE_SHARE=1$' /tmp/run.log &&
             grep -q '^DEST_PUBKEY_EQUALS_G_ATTACKER_SHARE=1$' /tmp/run.log &&
             grep -q '^ATTACKER_SOLO_ECDSA_SIGNATURE_VERIFIES=1$' /tmp/run.log; then
            STATUS=PASS
          fi
          echo "$STATUS" > /tmp/status.txt

      - name: Package and encrypt evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/evidence
          cp /tmp/status.txt /tmp/evidence/status.txt 2>/dev/null || echo INFRA_FAILURE > /tmp/evidence/status.txt
          cp /tmp/run.log /tmp/evidence/run.log 2>/dev/null || true
          cp /tmp/source_sha.txt /tmp/evidence/source_sha.txt 2>/dev/null || true
          cp /tmp/poc.diff /tmp/evidence/poc.diff 2>/dev/null || true
          cp /tmp/poc/fireblocks_p1_payload/test_fragment.cpp /tmp/evidence/test_fragment.cpp 2>/dev/null || true
          cp /tmp/mpc-lib/src/common/cosigner/cmp_setup_service.cpp /tmp/evidence/cmp_setup_service.cpp 2>/dev/null || true
          (cd /tmp && zip -qr result.zip evidence)

          head -c 48 /dev/urandom > /tmp/result_keyiv.bin
          KEY=$(dd if=/tmp/result_keyiv.bin bs=1 count=32 2>/dev/null | od -An -tx1 | tr -d ' \n')
          IV=$(dd if=/tmp/result_keyiv.bin bs=1 skip=32 count=16 2>/dev/null | od -An -tx1 | tr -d ' \n')
          openssl enc -aes-256-cbc -K "$KEY" -iv "$IV" -in /tmp/result.zip -out /tmp/result.enc
          openssl pkeyutl -encrypt -pubin -inkey /tmp/result_public.pem             -in /tmp/result_keyiv.bin -out /tmp/result_key.enc             -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256

          mkdir -p runner_exchange/fireblocks_p1
          base64 -w0 /tmp/result.enc > runner_exchange/fireblocks_p1/result.b64
          base64 -w0 /tmp/result_key.enc > runner_exchange/fireblocks_p1/result_key.b64
          cp /tmp/evidence/status.txt runner_exchange/fireblocks_p1/result_status.txt

          git config user.name "encrypted-fireblocks-validator"
          git config user.email "encrypted-fireblocks-validator@users.noreply.github.com"
          git add runner_exchange/fireblocks_p1/result.b64 runner_exchange/fireblocks_p1/result_key.b64 runner_exchange/fireblocks_p1/result_status.txt
          git commit -m "Publish encrypted Fireblocks validation result [skip ci]" >/dev/null
          git push origin HEAD:fireblocks-p1-encrypted-20260924 >/dev/null

      - name: Enforce result
        if: always()
        shell: bash
        run: |
          test -f /tmp/status.txt
          test "$(cat /tmp/status.txt)" = "PASS"
