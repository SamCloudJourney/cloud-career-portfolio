name: Fireblocks CMP authenticated source-binding fix validation

on:
  push:
    branches:
      - fireblocks-cmp-finalized-deep-20260924
    paths:
      - .github/workflows/fireblocks-cmp-finalized-deep.yml

permissions:
  contents: write

jobs:
  source-binding-fix:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout harness branch
        uses: actions/checkout@v4
        with:
          ref: fireblocks-cmp-finalized-deep-20260924
          fetch-depth: 0

      - name: Publish one-time payload key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner_exchange/fireblocks_cmp_source_binding_fix_v1
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/payload_private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/payload_private.pem -pubout -out runner_exchange/fireblocks_cmp_source_binding_fix_v1/payload_public.pem >/dev/null 2>&1
          git config user.name "fireblocks-source-binding-validator"
          git config user.email "fireblocks-source-binding-validator@users.noreply.github.com"
          git add runner_exchange/fireblocks_cmp_source_binding_fix_v1/payload_public.pem
          git commit -m "Publish Fireblocks source-binding fix one-time key [skip ci]" >/dev/null
          git push origin HEAD:fireblocks-cmp-finalized-deep-20260924 >/dev/null

      - name: Wait for encrypted fix payload
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for i in $(seq 1 300); do
            git fetch origin fireblocks-cmp-finalized-deep-20260924 --quiet
            ok=1
            for f in payload.b64 payload_key.b64; do
              git show "origin/fireblocks-cmp-finalized-deep-20260924:runner_exchange/fireblocks_cmp_source_binding_fix_v1/$f" > "/tmp/$f" 2>/dev/null || ok=0
            done
            if [ "$ok" = "1" ]; then found=1; break; fi
            sleep 2
          done
          test "$found" = "1"

      - name: Decrypt fix payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/payload_key.b64 > /tmp/payload_key.enc
          base64 -d /tmp/payload.b64 > /tmp/payload.enc
          openssl pkeyutl -decrypt -inkey /tmp/payload_private.pem             -in /tmp/payload_key.enc -out /tmp/payload_keyiv.bin             -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          test "$(stat -c%s /tmp/payload_keyiv.bin)" = "48"
          KEY=$(dd if=/tmp/payload_keyiv.bin bs=1 count=32 2>/dev/null | od -An -tx1 | tr -d ' \n')
          IV=$(dd if=/tmp/payload_keyiv.bin bs=1 skip=32 count=16 2>/dev/null | od -An -tx1 | tr -d ' \n')
          openssl enc -d -aes-256-cbc -K "$KEY" -iv "$IV" -in /tmp/payload.enc -out /tmp/payload.zip
          unzip -t /tmp/payload.zip >/dev/null
          rm -rf /tmp/poc && mkdir /tmp/poc
          unzip -q /tmp/payload.zip -d /tmp/poc
          test -f /tmp/poc/apply_fix.py
          test -f /tmp/poc/fix_test_fragment.cpp

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev uuid-dev libsecp256k1-dev

      - name: Fetch and patch exact Fireblocks source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mpc-lib
          git init -q /tmp/mpc-lib
          git -C /tmp/mpc-lib remote add origin https://github.com/fireblocks/mpc-lib.git
          git -C /tmp/mpc-lib fetch -q --depth 1 origin 00ae08b7f1bdbb887aedece384aca2f942aae432
          git -C /tmp/mpc-lib checkout -q FETCH_HEAD
          test "$(git -C /tmp/mpc-lib rev-parse HEAD)" = "00ae08b7f1bdbb887aedece384aca2f942aae432"
          python3 /tmp/poc/apply_fix.py /tmp/mpc-lib
          cat /tmp/poc/fix_test_fragment.cpp >> /tmp/mpc-lib/test/cosigner/setup_test.cpp
          git -C /tmp/mpc-lib diff --check
          sha256sum /tmp/poc/apply_fix.py /tmp/poc/fix_test_fragment.cpp
          git -C /tmp/mpc-lib diff -- include/cosigner/cmp_setup_service.h src/common/cosigner/cmp_setup_service.cpp test/cosigner/setup_test.cpp | sha256sum

      - name: Build real patched cosigner_test
        shell: bash
        run: |
          set -euo pipefail
          cmake -S /tmp/mpc-lib -B /tmp/mpc-fix-build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build /tmp/mpc-fix-build --target cosigner_test -j2

      - name: Prove source-binding fix blocks attacks
        shell: bash
        run: |
          set -euo pipefail
          /tmp/mpc-fix-build/test/cosigner/cosigner_test             "add_user authenticated source binding" --success 2>&1 | tee /tmp/binding.log
          grep -q '^BOUND_FIX_REJECTS_SINGLETON_SOURCE=1$' /tmp/binding.log
          grep -q '^BOUND_FIX_REJECTS_PARTIAL_2_OF_3_SOURCE_SET=1$' /tmp/binding.log
          grep -q '^BOUND_FIX_REJECTS_SUBSTITUTED_SOURCE_PUBLIC_KEY=1$' /tmp/binding.log
          grep -q '^BOUND_FIX_ACCEPTS_COMPLETE_AUTHENTIC_SOURCE=1$' /tmp/binding.log
          grep -q 'All tests passed' /tmp/binding.log
          echo "AUTHENTICATED_SOURCE_BINDING_FIX=PASS"

      - name: Run legitimate add-user integration
        shell: bash
        run: |
          set -euo pipefail
          /tmp/mpc-fix-build/test/cosigner/cosigner_test "add_user" --success 2>&1 | tee /tmp/add-user.log
          grep -q 'All tests passed' /tmp/add-user.log
          echo "LEGITIMATE_ADD_USER_WITH_BINDING=PASS"

      - name: Run legitimate add-user then signing integration
        shell: bash
        run: |
          set -euo pipefail
          /tmp/mpc-fix-build/test/cosigner/cosigner_test "cmp_ecdsa" --success 2>&1 | tee /tmp/cmp-ecdsa.log
          grep -q 'All tests passed' /tmp/cmp-ecdsa.log
          echo "LEGITIMATE_ADD_USER_THEN_SIGN_WITH_BINDING=PASS"

      - name: Run upgrade regression
        shell: bash
        run: |
          set -euo pipefail
          /tmp/mpc-fix-build/test/cosigner/cosigner_test "upgrade_key_to_cmp" --success 2>&1 | tee /tmp/upgrade.log
          grep -q 'All tests passed' /tmp/upgrade.log
          echo "UPGRADE_KEY_TO_CMP_UNCHANGED=PASS"
