name: Fireblocks CMP finalized-source public-key forgery P1 v2

on:
  push:
    branches:
      - fireblocks-cmp-p1-finalized-forgery-20260924
    paths:
      - .github/workflows/fireblocks-cmp-p1-finalized-forgery-v2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          ref: fireblocks-cmp-p1-finalized-forgery-20260924
          fetch-depth: 0

      - name: Publish v2 ephemeral payload key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner_exchange/fireblocks_cmp_finalized_v2
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/source_private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/source_private.pem -pubout -out runner_exchange/fireblocks_cmp_finalized_v2/source_public.pem >/dev/null 2>&1
          git config user.name "fireblocks-finalized-v2-validator"
          git config user.email "fireblocks-finalized-v2-validator@users.noreply.github.com"
          git add runner_exchange/fireblocks_cmp_finalized_v2/source_public.pem
          git commit -m "Publish Fireblocks finalized-source v2 key [skip ci]" >/dev/null
          git push origin HEAD:fireblocks-cmp-p1-finalized-forgery-20260924 >/dev/null

      - name: Wait for encrypted v2 payload
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for i in $(seq 1 300); do
            git fetch origin fireblocks-cmp-p1-finalized-forgery-20260924 --quiet
            ok=1
            for f in payload.b64 payload_key.b64; do
              git show "origin/fireblocks-cmp-p1-finalized-forgery-20260924:runner_exchange/fireblocks_cmp_finalized_v2/$f" > "/tmp/$f" 2>/dev/null || ok=0
            done
            if [ "$ok" = "1" ]; then found=1; break; fi
            sleep 2
          done
          test "$found" = "1"

      - name: Decrypt v2 payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/payload_key.b64 > /tmp/payload_key.enc
          base64 -d /tmp/payload.b64 > /tmp/payload.enc
          openssl pkeyutl -decrypt -inkey /tmp/source_private.pem             -in /tmp/payload_key.enc -out /tmp/payload_keyiv.bin             -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          KEY=$(dd if=/tmp/payload_keyiv.bin bs=1 count=32 2>/dev/null | od -An -tx1 | tr -d ' \n')
          IV=$(dd if=/tmp/payload_keyiv.bin bs=1 skip=32 count=16 2>/dev/null | od -An -tx1 | tr -d ' \n')
          openssl enc -d -aes-256-cbc -K "$KEY" -iv "$IV" -in /tmp/payload.enc -out /tmp/payload.zip
          unzip -t /tmp/payload.zip >/dev/null
          rm -rf /tmp/poc && mkdir /tmp/poc
          unzip -q /tmp/payload.zip -d /tmp/poc
          test -f /tmp/poc/test_fragment.cpp
          sha256sum /tmp/poc/test_fragment.cpp

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev uuid-dev libsecp256k1-dev

      - name: Fetch exact Fireblocks source twice
        run: |
          set -euo pipefail
          rm -rf /tmp/mpc-vuln /tmp/mpc-patched
          git init -q /tmp/mpc-vuln
          git -C /tmp/mpc-vuln remote add origin https://github.com/fireblocks/mpc-lib.git
          git -C /tmp/mpc-vuln fetch -q --depth 1 origin 00ae08b7f1bdbb887aedece384aca2f942aae432
          git -C /tmp/mpc-vuln checkout -q FETCH_HEAD
          test "$(git -C /tmp/mpc-vuln rev-parse HEAD)" = "00ae08b7f1bdbb887aedece384aca2f942aae432"
          cp -a /tmp/mpc-vuln /tmp/mpc-patched
          cat /tmp/poc/test_fragment.cpp >> /tmp/mpc-vuln/test/cosigner/ecdsa_online_test.cpp
          cat /tmp/poc/test_fragment.cpp >> /tmp/mpc-patched/test/cosigner/ecdsa_online_test.cpp
          git -C /tmp/mpc-vuln diff --check
          git -C /tmp/mpc-patched diff --check

      - name: Apply earlier two-guard hardening to second tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("/tmp/mpc-patched/src/common/cosigner/cmp_setup_service.cpp")
          s=p.read_text()
          old='''    if (data.size() == 0)
              {
                  LOG_ERROR("Got empty add user data map");
                  throw_cosigner_exception(cosigner_exception::INVALID_PARAMETERS);
              }
          '''
          new='''    if (data.size() < 2)
              {
                  LOG_ERROR("Got source parts from %u players, expected at least 2", (uint32_t)data.size());
                  throw_cosigner_exception(cosigner_exception::INVALID_PARAMETERS);
              }
          '''
          if old not in s: raise SystemExit("count guard anchor missing")
          s=s.replace(old,new,1)
          anchor='''    auto algebra = get_algebra(algorithm);

              for (auto i = players_ids.begin(); i != players_ids.end(); ++i)
          '''
          repl='''    auto algebra = get_algebra(algorithm);

              if (algebra->validate_non_infinity_point(algebra, &metadata.public_key) != ELLIPTIC_CURVE_ALGEBRA_SUCCESS)
              {
                  LOG_ERROR("key %s has an unset or invalid public key and cannot be redistributed", key_id.c_str());
                  throw_cosigner_exception(cosigner_exception::INVALID_PARAMETERS);
              }

              for (auto i = players_ids.begin(); i != players_ids.end(); ++i)
          '''
          if anchor not in s: raise SystemExit("point guard anchor missing")
          s=s.replace(anchor,repl,1)
          p.write_text(s)
          PY
          git -C /tmp/mpc-patched diff --check
          echo "EARLIER_TWO_GUARDS_APPLIED=1"

      - name: Build vulnerable and two-guard trees
        run: |
          set -euo pipefail
          cmake -S /tmp/mpc-vuln -B /tmp/build-vuln -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build /tmp/build-vuln --target cosigner_test -j2
          cmake -S /tmp/mpc-patched -B /tmp/build-patched -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build /tmp/build-patched --target cosigner_test -j2

      - name: Run finalized-source attack on current main
        shell: bash
        run: |
          set -euo pipefail
          /tmp/build-vuln/test/cosigner/cosigner_test             "cmp finalized source coalition forges expected public key" --success             2>&1 | tee /tmp/vuln.log
          grep -q '^P1_FINALIZED_SOURCE_FORGERY_CONFIRMED=1$' /tmp/vuln.log
          grep -q '^SOURCE_KEY_FULLY_FINALIZED=1$' /tmp/vuln.log
          grep -q '^UNMODIFIED_PUBLIC_KEY_CONTROL_REJECTED=1$' /tmp/vuln.log
          grep -q '^SOURCE_MAP_SIZE_2=1$' /tmp/vuln.log
          grep -q '^HONEST_DESTINATION_CMP_SIGNATURE_VERIFIES=1$' /tmp/vuln.log
          grep -q '^COALITION_SOLO_SIGNATURE_VERIFIES=1$' /tmp/vuln.log
          grep -q 'All tests passed' /tmp/vuln.log
          echo "CURRENT_MAIN_FINALIZED_SOURCE_ATTACK=PASS"

      - name: Run same attack after earlier two guards
        shell: bash
        run: |
          set -euo pipefail
          /tmp/build-patched/test/cosigner/cosigner_test             "cmp finalized source coalition forges expected public key" --success             2>&1 | tee /tmp/patched.log
          grep -q '^P1_FINALIZED_SOURCE_FORGERY_CONFIRMED=1$' /tmp/patched.log
          grep -q '^SOURCE_KEY_FULLY_FINALIZED=1$' /tmp/patched.log
          grep -q '^SOURCE_MAP_SIZE_2=1$' /tmp/patched.log
          grep -q '^HONEST_DESTINATION_CMP_SIGNATURE_VERIFIES=1$' /tmp/patched.log
          grep -q '^COALITION_SOLO_SIGNATURE_VERIFIES=1$' /tmp/patched.log
          grep -q 'All tests passed' /tmp/patched.log
          echo "EARLIER_TWO_GUARD_FIX_BYPASSED=1"
