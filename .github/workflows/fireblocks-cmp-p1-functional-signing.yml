name: Fireblocks CMP P1 functional destination signing

on:
  push:
    branches:
      - fireblocks-cmp-p1-functional-signing-20260924
    paths:
      - .github/workflows/fireblocks-cmp-p1-functional-signing.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout harness branch
        uses: actions/checkout@v4
        with:
          ref: fireblocks-cmp-p1-functional-signing-20260924
          fetch-depth: 0

      - name: Publish ephemeral payload key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner_exchange/fireblocks_cmp_functional
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/source_private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/source_private.pem -pubout -out runner_exchange/fireblocks_cmp_functional/source_public.pem >/dev/null 2>&1
          git config user.name "fireblocks-functional-validator"
          git config user.email "fireblocks-functional-validator@users.noreply.github.com"
          git add runner_exchange/fireblocks_cmp_functional/source_public.pem
          git commit -m "Publish Fireblocks functional-test ephemeral key [skip ci]" >/dev/null
          git push origin HEAD:fireblocks-cmp-p1-functional-signing-20260924 >/dev/null

      - name: Wait for encrypted regression payload
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for i in $(seq 1 300); do
            git fetch origin fireblocks-cmp-p1-functional-signing-20260924 --quiet
            ok=1
            for f in payload.b64 payload_key.b64; do
              git show "origin/fireblocks-cmp-p1-functional-signing-20260924:runner_exchange/fireblocks_cmp_functional/$f" > "/tmp/$f" 2>/dev/null || ok=0
            done
            if [ "$ok" = "1" ]; then found=1; break; fi
            sleep 2
          done
          test "$found" = "1"

      - name: Decrypt regression payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/payload_key.b64 > /tmp/payload_key.enc
          base64 -d /tmp/payload.b64 > /tmp/payload.enc
          openssl pkeyutl -decrypt -inkey /tmp/source_private.pem             -in /tmp/payload_key.enc -out /tmp/payload_keyiv.bin             -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          test "$(stat -c%s /tmp/payload_keyiv.bin)" = "48"
          KEY=$(dd if=/tmp/payload_keyiv.bin bs=1 count=32 2>/dev/null | od -An -tx1 | tr -d ' \n')
          IV=$(dd if=/tmp/payload_keyiv.bin bs=1 skip=32 count=16 2>/dev/null | od -An -tx1 | tr -d ' \n')
          openssl enc -d -aes-256-cbc -K "$KEY" -iv "$IV" -in /tmp/payload.enc -out /tmp/payload.zip
          unzip -t /tmp/payload.zip >/dev/null
          rm -rf /tmp/poc && mkdir /tmp/poc
          unzip -q /tmp/payload.zip -d /tmp/poc
          test -f /tmp/poc/test_fragment.cpp

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev uuid-dev libsecp256k1-dev

      - name: Fetch exact Fireblocks current main
        run: |
          set -euo pipefail
          rm -rf /tmp/mpc-lib
          git init -q /tmp/mpc-lib
          git -C /tmp/mpc-lib remote add origin https://github.com/fireblocks/mpc-lib.git
          git -C /tmp/mpc-lib fetch -q --depth 1 origin 00ae08b7f1bdbb887aedece384aca2f942aae432
          git -C /tmp/mpc-lib checkout -q FETCH_HEAD
          test "$(git -C /tmp/mpc-lib rev-parse HEAD)" = "00ae08b7f1bdbb887aedece384aca2f942aae432"
          git -C /tmp/mpc-lib rev-parse HEAD
          cat /tmp/poc/test_fragment.cpp >> /tmp/mpc-lib/test/cosigner/ecdsa_online_test.cpp
          git -C /tmp/mpc-lib diff --check
          git -C /tmp/mpc-lib diff -- test/cosigner/ecdsa_online_test.cpp | sha256sum

      - name: Build real upstream cosigner_test
        run: |
          set -euo pipefail
          cmake -S /tmp/mpc-lib -B /tmp/mpc-build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build /tmp/mpc-build --target cosigner_test -j2

      - name: Execute functional threshold-collapse regression repeatedly
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/all-runs.log
          for i in 1 2 3 4 5; do
            echo "===== FUNCTIONAL_TRIAL=$i =====" | tee -a /tmp/all-runs.log
            /tmp/mpc-build/test/cosigner/cosigner_test               "cmp poisoned add_user destination remains fully functional" --success               2>&1 | tee -a /tmp/all-runs.log
          done
          test "$(grep -c '^P1_FUNCTIONAL_CHAIN_CONFIRMED=1$' /tmp/all-runs.log)" = "5"
          test "$(grep -c '^HONEST_3_OF_3_DESTINATION_CMP_SIGNATURE_VERIFIES=1$' /tmp/all-runs.log)" = "5"
          test "$(grep -c '^OUTSIDER_A_SOLO_SIGNATURE_VERIFIES=1$' /tmp/all-runs.log)" = "5"
          test "$(grep -c '^DESTINATION_METADATA_T_EQ_N_EQ_3=1$' /tmp/all-runs.log)" = "5"
          test "$(grep -c '^MALICIOUS_SOURCE_NOT_IN_DESTINATION_SET=1$' /tmp/all-runs.log)" = "5"
          test "$(grep -c 'All tests passed' /tmp/all-runs.log)" = "5"
          echo "REAL_UPSTREAM_FUNCTIONAL_TRIALS=5/5_PASS"

# gfpfireblocks-two-message-retry
